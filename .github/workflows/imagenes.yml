# Construye las imágenes Docker en cada push a main y las publica en ghcr.io.
# El VPS no construye nada: deploy.sh solo descarga la imagen del commit.
name: Imágenes Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

# Si llegan dos push seguidos, se cancela el build viejo.
concurrency:
  group: imagenes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # El backend sirve el .exe del agente de impresión para que las cajas se
      # auto-actualicen (GET /api/v1/agente/version y /descargar). Se construye
      # aquí y entra a la imagen en backend/agente-dist/. Si falla, la imagen
      # sale igual y las cajas siguen con la versión que tienen.
      - uses: actions/setup-node@v4
        if: matrix.servicio == 'backend'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: print-agent/package-lock.json

      - name: Construir agente de impresión
        if: matrix.servicio == 'backend'
        continue-on-error: true
        working-directory: print-agent
        run: |
          npm ci
          npm run publicar -- --salida ../backend/agente-dist

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.servicio }}
          push: true
          tags: |
            ghcr.io/felipe4563/menu-${{ matrix.servicio }}:${{ github.sha }}
            ghcr.io/felipe4563/menu-${{ matrix.servicio }}:latest
          # deploy.sh usa esta etiqueta para borrar solo imágenes viejas de este proyecto.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}
