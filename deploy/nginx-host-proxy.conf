# Plantilla para el nginx NATIVO del VPS (fuera de Docker). La usa
# deploy/nuevo-restaurante.sh reemplazando __DOMINIO__ y __PUERTO__.
# Reenvía todo el tráfico del dominio al contenedor frontend del
# restaurante, que escucha en 127.0.0.1:__PUERTO__.
# Después: sudo certbot --nginx -d __DOMINIO__ (agrega el bloque 443 y el
# redirect 80→443 automáticamente).

server {
    listen 80;
    server_name __DOMINIO__;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:__PUERTO__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
