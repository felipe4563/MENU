# Cabeceras de seguridad. Se incluye en el server y en cada location que use
# add_header (en nginx un add_header dentro de un location anula los de afuera).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
